# nginx для Angular-remote, отдаваемого под префиксом пути.
#
# Traefik не срезает префикс: запрос /mfe/calculator/remoteEntry.mjs приходит в
# контейнер целиком, поэтому приложение отвечает ровно по этому пути.
#
# ВАЖНО про MIME: Angular отдаёт ES-модуль `remoteEntry.mjs`, а в стандартном
# `mime.types` образа nginx расширения `mjs` НЕТ. Браузер проверяет MIME для
# модулей строго и отказывается исполнять файл, отданный как
# `application/octet-stream`. Поэтому mime.types патчится в Dockerfile
# (`application/javascript ... js mjs;`) - проверено в самом образе.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Access-Control-Allow-Origin "*" always;

    location /mfe/calculator/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    location = /mfe/calculator {
        return 301 /mfe/calculator/;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
