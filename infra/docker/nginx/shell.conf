# nginx для shell - SPA, отдаваемое в корне.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой неизвестный путь отдаёт index.html, чтобы работали клиентские
    # маршруты (/credits, /calculator). Без этого прямой заход по адресу
    # маршрута дал бы 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Адреса remote'ов приходят из ConfigMap и монтируются поверх файла из
    # сборки: один образ работает в любом окружении, меняется только конфиг.
    # Отдавать его кэшируемо нельзя - иначе после смены адресов браузер
    # продолжит ходить по старым.
    location = /mfe-config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
