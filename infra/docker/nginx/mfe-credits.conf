# nginx для remote-приложения, отдаваемого под префиксом пути.
#
# Traefik (как и большинство ingress-контроллеров) НЕ срезает префикс: запрос
# /mfe/credits/remoteEntry.js приходит в контейнер целиком. Поэтому приложение
# раскладывается так, чтобы отвечать по этому префиксу, - иначе пришлось бы
# настраивать отдельный middleware StripPrefix.
#
# Почему префикс вообще нужен: remote'ы грузит БРАУЗЕР, а не shell, и наружу
# торчит один адрес ingress. Каждому remote нужен свой путь.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка remote'а кросс-доменная, если shell открыт по другому адресу
    # (например, через NodePort). Разрешаем явно, чтобы не повторять историю с
    # CORS на Angular-remote.
    add_header Access-Control-Allow-Origin "*" always;

    # Статика приложения: путь с префиксом соответствует корню каталога.
    location /mfe/credits/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # Обращение без завершающего слэша - уводим на канонический путь, иначе
    # относительные ссылки внутри index.html поедут.
    location = /mfe/credits {
        return 301 /mfe/credits/;
    }

    # Проба живости: файлы приложения не трогаем, отвечаем константой.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
