apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: {{ .Values.namespace | default "credithub" }}
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/part-of: credithub
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bff
        app.kubernetes.io/part-of: credithub
    spec:
      # Kubernetes по умолчанию создаёт для каждого сервиса namespace переменные
      # в стиле docker-links (`<ИМЯ>_PORT`, `<ИМЯ>_SERVICE_HOST` и прочие). Они
      # legacy, создают шум и уже приводили к конфликту имён: сервис `bff` давал
      # переменную `BFF_PORT=tcp://...`, которую читало приложение.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bff
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: CORE_API_URL
              value: {{ .Values.coreApi.url | quote }}
          # У BFF проба осмысленнее, чем у core-api: он проверяет только свой
          # процесс и не ходит в core-api. Иначе недоступность доменного сервиса
          # помечала бы BFF нездоровым, и ingress снял бы его с обслуживания.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
