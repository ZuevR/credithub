image:
  repository: ghcr.io/zuevr/credithub-bff
  tag: dev
  # Always, потому что тег `dev` изменяемый: при IfNotPresent нода берёт образ из
  # кэша и обновление чарта не приводит к новому коду. В проде тег должен быть
  # неизменяемым (например, git-sha), и тогда уместен IfNotPresent.
  pullPolicy: Always

# Список объектов `{name: ...}` - именно так, а не строки: Helm пропускает строки
# молча, а API-сервер отвергает манифест.
imagePullSecrets:
  - name: ghcr-pull

replicaCount: 1

coreApi:
  # Адрес доменного сервиса ВНУТРИ кластера - по DNS-имени сервиса, а не localhost.
  # Это и есть проверка того, что граница BFF↔core-api работает в кластере.
  # Путь включает префикс /api: у core-api все маршруты под ним.
  url: http://core-api.credithub.svc.cluster.local:3001/api

service:
  port: 3000

# Issuer Keycloak-реалма, из которого BFF принимает JWT. Проверяется в каждом
# токене (claim `iss`), поэтому при переходе стенда на https здесь тоже https.
kcIssuer: https://192.168.1.187/auth/realms/credithub

# Отдельный адрес JWKS. Ключи берём ВНУТРИ кластера по http, хотя issuer внешний
# и https: внешний сертификат самоподписанный, и Node его не примет, а доверие
# токену всё равно даёт проверка подписи вместе с совпадением `iss`.
# Имя сервиса одинаково в любом кластере, поэтому здесь, в отличие от issuer'а,
# уместно значение по умолчанию, а не --set.
kcJwksUri: http://keycloak.credithub.svc.cluster.local:8080/auth/realms/credithub/protocol/openid-connect/certs

# BFF - единственная точка API для фронта, поэтому он выставляется через Ingress.
# Правило без host: обращение по IP хоста (DNS-имени у нас нет).
ingress:
  enabled: true
  className: traefik
  path: /api

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 384Mi
