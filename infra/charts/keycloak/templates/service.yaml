apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ .Values.namespace | default "credithub" }}
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: credithub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
