# Namespace, в котором живут сервисы проекта.
#
# Отдельный чарт, а не файл внутри чарта приложения: namespace - ресурс
# кластерного уровня, и если бы им владел, например, чарт postgres, то удаление
# базы (`helm uninstall postgres`) сносило бы namespace вместе со всеми
# остальными сервисами.
namespace: credithub
