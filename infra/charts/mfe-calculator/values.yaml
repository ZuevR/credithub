image:
  repository: ghcr.io/zuevr/credithub-mfe-calculator
  tag: dev
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull

replicaCount: 1

service:
  port: 80

# Remote грузит браузер, поэтому он должен быть доступен снаружи.
ingress:
  enabled: true
  className: traefik
  path: /mfe/calculator

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 192Mi
