image:
  repository: ghcr.io/zuevr/credithub-mfe-credits
  tag: dev
  # Always: тег `dev` изменяемый, иначе нода отдаёт прежний образ из кэша.
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull

replicaCount: 1

service:
  port: 80

# Remote грузит БРАУЗЕР, а не shell, поэтому он обязан быть доступен снаружи -
# в отличие от core-api, который виден только внутри кластера.
ingress:
  enabled: true
  className: traefik
  path: /mfe/credits

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 192Mi
