image:
  repository: ghcr.io/zuevr/credithub-mfe-programs
  tag: dev
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull

replicaCount: 1

service:
  port: 8106

# Два пути на один сервис: человекочитаемый адрес документа и ingress-путь
# сервиса, по которому отдаются ещё и ассеты (assetPrefix в сборке).
ingress:
  enabled: true
  className: traefik
  documentPath: /programs
  assetsPath: /mfe/programs

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 512Mi
