{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mfe-programs
  namespace: {{ .Values.namespace | default "credithub" }}
  labels:
    app.kubernetes.io/name: mfe-programs
    app.kubernetes.io/part-of: credithub
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    # Без `host`: обращаемся по IP хоста.
    - http:
        paths:
          # Человекочитаемый адрес публичного раздела.
          - path: {{ .Values.ingress.documentPath }}
            pathType: Prefix
            backend:
              service:
                name: mfe-programs
                port:
                  number: {{ .Values.service.port }}
          # Путь сервиса: по нему же отдаются ассеты (assetPrefix '/mfe/programs'),
          # поэтому один префикс обслуживает и документ, и статику.
          - path: {{ .Values.ingress.assetsPath }}
            pathType: Prefix
            backend:
              service:
                name: mfe-programs
                port:
                  number: {{ .Values.service.port }}
{{- end }}
