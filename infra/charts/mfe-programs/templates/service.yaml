apiVersion: v1
kind: Service
metadata:
  name: mfe-programs
  namespace: {{ .Values.namespace | default "credithub" }}
  labels:
    app.kubernetes.io/name: mfe-programs
    app.kubernetes.io/part-of: credithub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mfe-programs
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8106
