apiVersion: apps/v1
kind: Deployment
metadata:
  name: mfe-programs
  namespace: {{ .Values.namespace | default "credithub" }}
  labels:
    app.kubernetes.io/name: mfe-programs
    app.kubernetes.io/part-of: credithub
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mfe-programs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mfe-programs
        app.kubernetes.io/part-of: credithub
    spec:
      # Kubernetes иначе создаёт docker-link переменные для сервисов namespace;
      # нашему коду они не нужны, а конфликт имён уже приводил к падению BFF.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mfe-programs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8106
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.service.port | quote }}
          # Дешёвая проба: полный серверный рендер на каждую проверку не нужен.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
