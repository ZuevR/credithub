{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.auth.username | quote }}
  POSTGRES_DB: {{ .Values.auth.database | quote }}
  # `required` вместо пустой строки: лучше упасть на рендере чарта с понятным
  # сообщением, чем поднять базу, к которой нельзя подключиться.
  POSTGRES_PASSWORD: {{ required "нет ни auth.existingSecret, ни auth.password: передайте --set auth.password=<секрет>" .Values.auth.password | quote }}
{{- end }}
